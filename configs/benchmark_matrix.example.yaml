# Benchmark execution matrix template for openllm-deploybench
benchmark:
  name: "openllm_deploybench_comprehensive"
  output_format: "jsonl"

runtime:
  engine: "vllm"
  mode: "online"  # online | offline
  tensor_parallel_size: "auto"
  gpu_memory_utilization: 0.92
  enforce_eager: false
  seed: 42
  port: 8000
  host: "127.0.0.1"
  server_startup_timeout_sec: 900

  # High-throughput serving flags
  reproducible: true
  use_v1_engine: true
  enable_chunked_prefill: true
  enable_prefix_caching: true
  num_warmups: 16
  max_cudagraph_capture_size: 512

# Saturation-based Dynamic Early Stopping configuration
early_stopping:
  enabled: true
  min_concurrency_steps: 3          # Minimum number of steps to always execute (e.g. 1, 4, 8)
  tps_improvement_threshold: 0.03   # Stop if throughput improvement falls below 3%
  patience: 1                       # Execute 1 extra step past plateau to capture saturation knee
  max_ttft_p99_ms: 15000            # Stop if P99 TTFT exceeds 15,000 ms (15s queue explosion)
  max_error_rate: 0.05              # Stop if more than 5% of requests fail or time out

models:
  # ==========================================
  # 7B / 8B Tier (BF16 vs Native FP8)
  # ==========================================
  - model_id: "qwen2_5_7b_instruct"
    quantization: null
    dtype: "bfloat16"
    max_model_len:
      - 8192

  - model_id: "qwen2_5_7b_instruct_fp8"
    quantization: "fp8"
    dtype: "auto"
    max_model_len:
      - 8192

  - model_id: "llama_3_1_8b_instruct_fp8"
    quantization: "fp8"
    dtype: "auto"
    max_model_len:
      - 8192

  # ==========================================
  # 14B / 27B Tier (Mid-size Dense & BF16 Upper Limit)
  # ==========================================
  - model_id: "qwen2_5_14b_instruct_fp8"
    quantization: "fp8"
    dtype: "auto"
    max_model_len:
      - 8192

  - model_id: "qwen3_8_27b_instruct"
    quantization: null
    dtype: "bfloat16"
    max_model_len:
      - 8192

  - model_id: "qwen3_8_27b_instruct_fp8"
    quantization: "fp8"
    dtype: "auto"
    max_model_len:
      - 8192

  # ==========================================
  # 32B / 70B Tier (FP8 vs 4-bit AWQ)
  # ==========================================
  - model_id: "qwen2_5_32b_instruct_fp8"
    quantization: "fp8"
    dtype: "auto"
    max_model_len:
      - 8192

  - model_id: "qwen2_5_32b_instruct_awq"
    quantization: "awq"
    dtype: "auto"
    max_model_len:
      - 8192

  - model_id: "llama_3_3_70b_instruct_fp8"
    quantization: "fp8"
    dtype: "auto"
    max_model_len:
      - 8192

  - model_id: "llama_3_1_70b_instruct_awq"
    quantization: "awq"
    dtype: "auto"
    max_model_len:
      - 8192

workloads:
  # 1. Chat: Measures max system concurrency & peak decode throughput
  - id: "chat_512_256"
    type: "synthetic"
    template: "chat"
    prompt_tokens: 512
    output_tokens: 256
    num_prompts: 512
    concurrency:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512

  # 2. Coding: Measures sustained memory bandwidth saturation
  - id: "coding_2048_1024"
    type: "synthetic"
    template: "coding"
    prompt_tokens: 2048
    output_tokens: 1024
    num_prompts: 256
    concurrency:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512

  # 3. RAG: Measures heavy prefill compute saturation and TTFT explosion
  - id: "rag_8192_512"
    type: "synthetic"
    template: "rag"
    prompt_tokens: 8192
    output_tokens: 512
    num_prompts: 128
    concurrency:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512

  # 4. Long Context RAG: Context length limits
  - id: "long_rag_32768_512"
    type: "synthetic"
    template: "rag"
    prompt_tokens: 32768
    output_tokens: 512
    num_prompts: 64
    concurrency:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64

long_context:
  enabled: false
  context_lengths:
    - 8192
    - 16384
    - 32768
  needle_positions:
    - 0.10
    - 0.50
    - 0.90
  num_trials_per_setting: 3

monitoring:
  sample_interval_seconds: 0.5
  log_gpu_power: true
  log_gpu_memory: true
  log_gpu_utilization: true